AWSTemplateFormatVersion: 2010-09-09
Description: This template creates the ECS task definition responsible for running the container \
 for the Sagemaker Pipeline construction
Parameters:
  ECSTaskDefinitionName:
    Type: String
    Default: CaseCreditFraud
    Description: Enter a name for the ECS Task Definition.
  ContainerEnvironmentFileS3ARN:
    Type: String
    Description: Enter the S3 path to the environment file for the container.
  S3BucketName:
    Type: String
    Description: Name of the S3 bucket used for data, scripts, and artifacts.
  InitialImageTag:
    Type: String
    Default: "1.0.0"
    Description: Initial tag value for the ECS Task Definition container image. \
      Replaced automatically by CodePipeline continuous integration.
Resources:
  SageMakerExecutionRole:
    UpdateReplacePolicy: "Delete"
    Type: "AWS::IAM::Role"
    DeletionPolicy: "Delete"
    Properties:
      Path: "/service-role/"
      ManagedPolicyArns:
      - "arn:aws:iam::aws:policy/AmazonRDSReadOnlyAccess"
      MaxSessionDuration: 3600
      RoleName: "SageMakerExecutionRole"
      Description: "SageMaker execution role scoped to the documented pipeline workflow"
      Policies:
      - PolicyDocument:
          Version: "2012-10-17"
          Statement:
          - Resource:
            - !Sub "arn:aws:s3:::${S3BucketName}"
            - !Sub "arn:aws:s3:::${S3BucketName}/*"
            Action:
            - "s3:GetObject"
            - "s3:PutObject"
            - "s3:DeleteObject"
            - "s3:ListBucket"
            Effect: "Allow"
            Sid: "S3BucketAccess"
        PolicyName: "S3BucketAccess"
      - PolicyDocument:
          Version: "2012-10-17"
          Statement:
          - Resource:
            - "*"
            Action:
            - "sagemaker-mlflow:*"
            Effect: "Allow"
            Sid: "MlflowAccess"
        PolicyName: "MLFlowAccess"
      - PolicyDocument:
          Version: "2012-10-17"
          Statement:
          - Resource:
            - "*"
            Action:
            - "iam:CreateServiceLinkedRole"
            - "iam:GetRole"
            - "iam:GetRolePolicy"
            - "iam:PassRole"
            - "iam:ListRoles"
            Effect: "Allow"
            Sid: "IAMServiceLinkedRole"
        PolicyName: "IAMServiceLinkedRole"
      - PolicyDocument:
          Version: "2012-10-17"
          Statement:
          - Resource: "*"
            Action:
            - "sagemaker:AddTags"
            - "sagemaker:CreatePipeline"
            - "sagemaker:UpdatePipeline"
            - "sagemaker:DescribePipeline"
            - "sagemaker:ListPipelines"
            - "sagemaker:DeletePipeline"
            - "sagemaker:StartPipelineExecution"
            - "sagemaker:DescribePipelineExecution"
            - "sagemaker:ListPipelineExecutions"
            - "sagemaker:StopPipelineExecution"
            - "sagemaker:CreateProcessingJob"
            - "sagemaker:DescribeProcessingJob"
            - "sagemaker:ListProcessingJobs"
            - "sagemaker:StopProcessingJob"
            - "sagemaker:CreateTrainingJob"
            - "sagemaker:DescribeTrainingJob"
            - "sagemaker:ListTrainingJobs"
            - "sagemaker:StopTrainingJob"
            - "sagemaker:CreateModel"
            - "sagemaker:DescribeModel"
            - "sagemaker:ListModels"
            - "sagemaker:CreateEndpointConfig"
            - "sagemaker:DescribeEndpointConfig"
            - "sagemaker:CreateEndpoint"
            - "sagemaker:UpdateEndpoint"
            - "sagemaker:DescribeEndpoint"
            - "sagemaker:ListEndpoints"
            - "sagemaker:InvokeEndpoint"
            - "sagemaker:ListTags"
            - "sagemaker:DescribeModelPackage"
            - "sagemaker:DescribeModelPackageGroup"
            Effect: "Allow"
            Sid: "SageMakerPipelineAccess"
        PolicyName: "SageMakerPipelineAccess"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
        - Action: "sts:AssumeRole"
          Effect: "Allow"
          Principal:
            Service: "sagemaker.amazonaws.com"
  ECSExecutionRole:
    Type: "AWS::IAM::Role"
    Properties:
      Path: "/"
      ManagedPolicyArns:
      - "arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      MaxSessionDuration: 3600
      RoleName: "ECSExecutionRole"
      Description: "Execution and task role for the pipeline container and the supporting Lambda functions"
      Policies:
      - PolicyDocument:
          Version: "2012-10-17"
          Statement:
          - Resource: "*"
            Action:
            - "codepipeline:PutJobSuccessResult"
            Effect: "Allow"
            Sid: "CodePipelineResultSuccess"
        PolicyName: "CodePipelineResultSuccess"
      - PolicyDocument:
          Version: "2012-10-17"
          Statement:
          - Resource: "*"
            Action:
            - "sagemaker-mlflow:CreateRun"
            - "sagemaker-mlflow:UpdateRun"
            - "sagemaker-mlflow:GetRun"
            Effect: "Allow"
            Sid: "SagemakerMlflowManageRun"
        PolicyName: "SagemakerMlflowManageRun"
      - PolicyDocument:
          Version: "2012-10-17"
          Statement:
          - Resource: "*"
            Action:
            - "secretsmanager:GetSecretValue"
            Effect: "Allow"
            Sid: "SecretsManagerGetSecretValue"
        PolicyName: "SecretsManagerGetSecretValue"
      - PolicyDocument:
          Version: "2012-10-17"
          Statement:
          - Resource:
            - !Sub "arn:aws:s3:::${S3BucketName}"
            - !Sub "arn:aws:s3:::${S3BucketName}/*"
            Action:
            - "s3:GetObject"
            - "s3:PutObject"
            - "s3:DeleteObject"
            - "s3:ListBucket"
            Effect: "Allow"
            Sid: "S3BucketAccess"
        PolicyName: "S3BucketAccess"
      - PolicyDocument:
          Version: "2012-10-17"
          Statement:
          - Resource: "*"
            Action:
            - "ecr:GetAuthorizationToken"
            Effect: "Allow"
            Sid: "EcrAuthToken"
          - Resource: !Sub
            - "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ecrRepository}"
            - ecrRepository: !ImportValue Storage-ECRRepository
            Action:
            - "ecr:BatchCheckLayerAvailability"
            - "ecr:BatchGetImage"
            - "ecr:GetDownloadUrlForLayer"
            Effect: "Allow"
            Sid: "EcrPull"
        PolicyName: "EcrAccess"
      - PolicyDocument:
          Version: "2012-10-17"
          Statement:
          - Resource: "*"
            Action:
            - "ecs:RunTask"
            - "ecs:DescribeTaskDefinition"
            - "ecs:RegisterTaskDefinition"
            - "ecs:DeregisterTaskDefinition"
            - "ecs:DescribeTasks"
            - "ecs:ListTasks"
            - "ecs:DescribeClusters"
            Effect: "Allow"
            Sid: "EcsRunTask"
        PolicyName: "EcsRunTask"
      - PolicyDocument:
          Version: "2012-10-17"
          Statement:
          - Condition:
              StringEquals:
                iam:PassedToService: "ecs-tasks.amazonaws.com"
            Resource:
            - !GetAtt ECSExecutionRole.Arn
            Action: "iam:PassRole"
            Effect: "Allow"
            Sid: "PassRoleToEcsTasks"
        PolicyName: "PassRoleToEcsTasks"
      - PolicyDocument:
          Version: "2012-10-17"
          Statement:
          - Resource: "*"
            Action:
            - "ec2:DescribeSubnets"
            - "ec2:DescribeVpcs"
            - "ec2:DescribeNetworkInterfaces"
            Effect: "Allow"
            Sid: "DescribeVpc"
        PolicyName: "DescribeVpc"
      - PolicyDocument:
          Version: "2012-10-17"
          Statement:
          - Resource: "*"
            Action:
            - "lambda:GetFunction"
            - "lambda:ListFunctions"
            - "lambda:InvokeFunction"
            Effect: "Allow"
            Sid: "InvokeLambda"
        PolicyName: "InvokeLambda"
      - PolicyDocument:
          Version: "2012-10-17"
          Statement:
          - Resource: "*"
            Action:
            - "sagemaker:AddTags"
            - "sagemaker:CreatePipeline"
            - "sagemaker:UpdatePipeline"
            - "sagemaker:DescribePipeline"
            - "sagemaker:ListPipelines"
            - "sagemaker:DeletePipeline"
            - "sagemaker:StartPipelineExecution"
            - "sagemaker:DescribePipelineExecution"
            - "sagemaker:ListPipelineExecutions"
            - "sagemaker:StopPipelineExecution"
            - "sagemaker:CreateProcessingJob"
            - "sagemaker:DescribeProcessingJob"
            - "sagemaker:ListProcessingJobs"
            - "sagemaker:StopProcessingJob"
            - "sagemaker:CreateTrainingJob"
            - "sagemaker:DescribeTrainingJob"
            - "sagemaker:ListTrainingJobs"
            - "sagemaker:StopTrainingJob"
            - "sagemaker:CreateModel"
            - "sagemaker:DescribeModel"
            - "sagemaker:ListModels"
            - "sagemaker:CreateEndpointConfig"
            - "sagemaker:DescribeEndpointConfig"
            - "sagemaker:CreateEndpoint"
            - "sagemaker:UpdateEndpoint"
            - "sagemaker:DescribeEndpoint"
            - "sagemaker:ListEndpoints"
            - "sagemaker:InvokeEndpoint"
            - "sagemaker:ListTags"
            - "sagemaker:DescribeModelPackage"
            - "sagemaker:DescribeModelPackageGroup"
            Effect: "Allow"
            Sid: "SageMakerPipelineAccess"
        PolicyName: "SageMakerPipelineAccess"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
        - Action: "sts:AssumeRole"
          Effect: "Allow"
          Principal:
            Service: "ecs-tasks.amazonaws.com"
          Sid: ""
        - Action: "sts:AssumeRole"
          Effect: "Allow"
          Principal:
            Service: "lambda.amazonaws.com"
  ECSTaskDefinition:
    DependsOn:
      - ECSExecutionRole
    Type: "AWS::ECS::TaskDefinition"
    Properties:
      TaskRoleArn: !GetAtt ECSExecutionRole.Arn
      InferenceAccelerators: []
      Memory: "512"
      PlacementConstraints: []
      Cpu: "256"
      RequiresCompatibilities:
      - "FARGATE"
      NetworkMode: "awsvpc"
      ExecutionRoleArn: !GetAtt ECSExecutionRole.Arn
      RuntimePlatform:
        OperatingSystemFamily: "LINUX"
        CpuArchitecture: "X86_64"
      Volumes: []
      ContainerDefinitions:
      - ExtraHosts: []
        Secrets: []
        VolumesFrom: []
        Cpu: 0
        EntryPoint: []
        DnsServers: []
        Image: !Sub
          - "${AWSAccountID}.dkr.ecr.${AWSRegion}.amazonaws.com/${Repository}:${Tag}"
          - AWSAccountID: !Ref AWS::AccountId
            AWSRegion: !Ref AWS::Region
            Repository: !ImportValue Storage-ECRRepository
            Tag: !Ref InitialImageTag
        Essential: true
        LogConfiguration:
          SecretOptions: []
          Options:
            awslogs-create-group: true
            awslogs-group: "/aws/batch/job"
            awslogs-region: !Ref AWS::Region
            awslogs-stream-prefix: "CaseCreditFraud"
          LogDriver: "awslogs"
        ResourceRequirements: []
        EnvironmentFiles:
          - Value: !Ref ContainerEnvironmentFileS3ARN
            Type: s3
        Name: "default"
        MountPoints: []
        DependsOn: []
        DockerLabels: {}
        PortMappings: []
        DockerSecurityOptions: []
        SystemControls: []
        Command: []
        DnsSearchDomains: []
        Environment: []
        Links: []
        CredentialSpecs: []
        Ulimits: []
      Family: "CaseCreditFraud"
      Tags: []
  ECSCluster:
    DependsOn:
      - ECSExecutionRole
    UpdateReplacePolicy: "Delete"
    Type: "AWS::ECS::Cluster"
    DeletionPolicy: "Delete"
    Properties:
      CapacityProviders:
      - "FARGATE"
      ClusterName: "AWSFargateComputeEnv"
      ClusterSettings:
      - Value: "disabled"
        Name: "containerInsights"
      DefaultCapacityProviderStrategy:
      - Weight: 1
        Base: 0
        CapacityProvider: "FARGATE"
Outputs:
  ECSExecutionRoleARN:
    Description: "The ARN of the ECS Execution Role Created by the ECS Stack"
    Value: !GetAtt ECSExecutionRole.Arn 
    Export:
      Name: ecs-task-definition-ECSExecutionRoleARN
  ECSClusterArn:
    Description: "The ARN of the ECS Cluster"
    Value: !GetAtt ECSCluster.Arn 
    Export:
      Name: ecs-task-definition-ECSClusterARN